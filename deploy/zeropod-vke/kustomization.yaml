apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - https://github.com/ctrox/zeropod/config/production
components:
  - https://github.com/ctrox/zeropod/config/tracker-ignore-localhost
  - https://github.com/ctrox/zeropod/config/status-labels
images:
  - name: ghcr.io/ctrox/zeropod-installer
    newName: ghcr.io/phoenixsolutionsgroup/zeropod-installer
    newTag: dev
  - name: ghcr.io/ctrox/zeropod-manager
    newName: ghcr.io/phoenixsolutionsgroup/zeropod-manager
    newTag: dev
patches:
  # VKE containerd config is at /opt/containerd/config.toml (not /etc/containerd/)
  # Also replace nodeSelector to auto-deploy on VKE node pool (no manual labeling)
  - target:
      kind: DaemonSet
      name: zeropod-node
    patch: |
      apiVersion: apps/v1
      kind: DaemonSet
      metadata:
        name: zeropod-node
      spec:
        template:
          spec:
            nodeSelector:
              zeropod.ctrox.dev/node: "true"
            volumes:
              - name: containerd-etc
                hostPath:
                  path: /opt/containerd/
  # Remove the upstream zeropod.ctrox.dev/node label requirement
  - target:
      kind: DaemonSet
      name: zeropod-node
    patch: |-
      - op: replace
        path: /spec/template/spec/nodeSelector
        value:
          zeropod.ctrox.dev/node: "true"
