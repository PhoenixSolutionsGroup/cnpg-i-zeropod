---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  labels:
    app.kubernetes.io/name: zeropod-node
  name: zeropod-node
  namespace: zeropod-system
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: zeropod-node
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zeropod-node
    spec:
      containers:
      - args:
        - -metrics-addr=:8080
        - -in-place-scaling=true
        - -status-labels=true
        - -status-events=true
        - -status-labels=true
        command:
        - /zeropod-manager
        env:
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        image: ghcr.io/phoenixsolutionsgroup/zeropod-manager:dev
        imagePullPolicy: IfNotPresent
        name: manager
        ports:
        - containerPort: 8080
          name: metrics
        - containerPort: 8090
          name: node-server
        securityContext:
          appArmorProfile:
            type: Unconfined
          capabilities:
            add:
            - SYS_PTRACE
            - SYS_ADMIN
            - NET_ADMIN
            - SYS_RESOURCE
        volumeMounts:
        - mountPath: /run/zeropod
          name: zeropod-run
        - mountPath: /var/lib/zeropod
          name: zeropod-var
        - mountPath: /hostproc
          name: hostproc
        - mountPath: /sys/fs/bpf
          name: bpf
        - mountPath: /tls
          name: tls
      initContainers:
      - args:
        - -criu-image=ghcr.io/ctrox/zeropod-criu:v4.2
        - -tracker-ignore-localhost=true
        image: ghcr.io/phoenixsolutionsgroup/zeropod-installer:dev
        imagePullPolicy: IfNotPresent
        name: installer
        volumeMounts:
        - mountPath: /host
          name: hostroot
        - mountPath: /etc/containerd
          name: containerd-etc
        - mountPath: /run/containerd
          name: containerd-run
        - mountPath: /opt/zeropod
          name: zeropod-opt
        - mountPath: /run/systemd
          name: systemd-run
        - mountPath: /etc/criu
          name: criu-etc
        - mountPath: /tls
          name: tls
      - args:
        - mount | grep "/sys/fs/bpf type bpf" || mount -t bpf bpf /sys/fs/bpf
        command:
        - /bin/sh
        - -c
        - --
        image: alpine:3.19.1
        imagePullPolicy: IfNotPresent
        name: prepare-bpf-fs
        securityContext:
          privileged: true
        volumeMounts:
        - mountPath: /sys/fs/bpf
          mountPropagation: Bidirectional
          name: bpf
      serviceAccountName: zeropod-node
      tolerations:
      - operator: Exists
      volumes:
      - hostPath:
          path: /opt/containerd/
        name: containerd-etc
      - hostPath:
          path: /
        name: hostroot
      - hostPath:
          path: /run/containerd
        name: containerd-run
      - hostPath:
          path: /var/lib/zeropod
        name: zeropod-var
      - hostPath:
          path: /opt/zeropod
        name: zeropod-opt
      - hostPath:
          path: /run/zeropod
        name: zeropod-run
      - hostPath:
          path: /run/systemd
        name: systemd-run
      - hostPath:
          path: /etc/criu
        name: criu-etc
      - hostPath:
          path: /proc
          type: Directory
        name: hostproc
      - hostPath:
          path: /sys/fs/bpf
          type: Directory
        name: bpf
      - emptyDir: {}
        name: tls
---
apiVersion: node.k8s.io/v1
handler: zeropod
kind: RuntimeClass
metadata:
  name: zeropod
