apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "cnpg-i-zeropod.fullname" . }}-controller
  labels:
    {{- include "cnpg-i-zeropod.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["scheduledbackups"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["poolers"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "cnpg-i-zeropod.fullname" . }}-controller
  labels:
    {{- include "cnpg-i-zeropod.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "cnpg-i-zeropod.fullname" . }}-controller
subjects:
  - kind: ServiceAccount
    name: {{ include "cnpg-i-zeropod.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
