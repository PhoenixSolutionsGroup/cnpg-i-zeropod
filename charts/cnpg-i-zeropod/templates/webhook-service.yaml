apiVersion: v1
kind: Service
metadata:
  name: {{ include "cnpg-i-zeropod.fullname" . }}-controller
  labels:
    {{- include "cnpg-i-zeropod.labels" . | nindent 4 }}
spec:
  ports:
    - name: webhook
      port: 443
      protocol: TCP
      targetPort: {{ .Values.webhook.port }}
  selector:
    {{- include "cnpg-i-zeropod.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: controller
