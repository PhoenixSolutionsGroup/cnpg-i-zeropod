apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: {{ include "cnpg-i-zeropod.fullname" . }}-pooler
  labels:
    {{- include "cnpg-i-zeropod.labels" . | nindent 4 }}
  annotations:
    cert-manager.io/inject-ca-from: {{ .Release.Namespace }}/{{ include "cnpg-i-zeropod.fullname" . }}-webhook
webhooks:
  - name: pooler.cnpg-i-zeropod.io
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Ignore
    clientConfig:
      service:
        name: {{ include "cnpg-i-zeropod.fullname" . }}-controller
        namespace: {{ .Release.Namespace }}
        path: /mutate-pooler
        port: 443
    objectSelector:
      matchLabels:
        cnpg.io/podRole: pooler
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
        scope: Namespaced
