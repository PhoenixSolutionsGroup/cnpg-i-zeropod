apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cnpg-i-zeropod.fullname" . }}-controller
  labels:
    {{- include "cnpg-i-zeropod.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "cnpg-i-zeropod.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: controller
  template:
    metadata:
      labels:
        {{- include "cnpg-i-zeropod.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: controller
    spec:
      serviceAccountName: {{ include "cnpg-i-zeropod.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: controller
          image: "{{ .Values.image.repository }}:{{ include "cnpg-i-zeropod.imageTag" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - controller
            - --webhook-cert-dir=/webhook-certs
            - --webhook-port={{ .Values.webhook.port }}
          ports:
            - name: webhook
              containerPort: {{ .Values.webhook.port }}
              protocol: TCP
          volumeMounts:
            - name: webhook-certs
              mountPath: /webhook-certs
              readOnly: true
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: webhook-certs
          secret:
            secretName: {{ .Values.webhook.certSecretName }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
